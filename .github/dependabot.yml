# Weekly dependency updates. Minor and patch bumps are grouped into one PR per ecosystem to keep noise low;
# major bumps arrive as individual PRs so they get a deliberate review.
version: 2
updates:
  # Backend Python dependencies. The `uv` ecosystem reads backend/pyproject.toml and updates backend/uv.lock too
  # (the `pip` ecosystem would not touch the lockfile that `uv sync --frozen` and the CI audit install from).
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Frontend and E2E npm dependencies.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      npm-e2e-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images and the uv binary copied in by the Dockerfiles.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      docker-backend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      docker-frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  # Keep the Playwright image tag equal to the exact @playwright/test version in e2e/package.json.
  - package-ecosystem: docker
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      docker-e2e-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions used by .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
